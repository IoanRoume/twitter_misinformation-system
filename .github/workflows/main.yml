name: CI/CD for Misinformation API

on:
  push:
    branches:
      - main  # This pipeline runs every time you push to the 'main' branch

jobs:
  build_and_push_docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest  # Use a standard Linux runner

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      # This fixes the "repository name must be lowercase" error
      - name: Convert repository name to lowercase
        id: string # Give this step an ID
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # This is a secret token provided by GitHub

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.string.outputs.repo }}:latest # Tags the image with the lowercase repo name